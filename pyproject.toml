[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hn-data-pipeline"
version = "0.2.0"
description = "Hacker News ETL Pipeline with LLM-powered Classification"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "beautifulsoup4>=4.11.0",
    "pandas>=1.5.0",
    "langchain-openai>=0.1.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.65.0",
    "pydantic>=2.0.0",
    "matplotlib>=3.5.0"
]

[project.scripts]
hn-pipeline = "src.main:main"
